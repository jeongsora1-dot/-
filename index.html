<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>인구 2050 : 대한민국 인구 챌린지</title>
<style>
*{box-sizing:border-box}
:root{--ink:#172033;--muted:#64748b;--paper:#fff;--bg:#eef3f8;--red:#ff624c;--blue:#5264d9;--green:#20a06a;--line:#e5e9f0;--yellow:#ffca52}
body{margin:0;background:var(--bg);font-family:"Noto Sans KR","Malgun Gothic",sans-serif;color:var(--ink)}
button{font:inherit;cursor:pointer}
#app{min-height:100vh}.nav{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(18px,calc((100vw - 1120px)/2));position:sticky;top:0;z-index:20}.logo{font-size:19px;font-weight:950;letter-spacing:-.8px}.logo span{color:var(--red)}.navright{display:flex;gap:8px}.pill{background:#f3f5f8;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:900}
.wrap{max-width:1120px;margin:auto;padding:25px 16px 55px}.panel{background:#fff;border-radius:27px;box-shadow:0 13px 42px rgba(35,48,72,.11);overflow:hidden}
.hero{min-height:650px;padding:55px;position:relative;overflow:hidden;background:linear-gradient(135deg,#dff6f1,#f5f8ff 60%,#eeeaff)}.hero:before{content:"";position:absolute;width:330px;height:330px;border-radius:50%;right:-80px;top:-90px;background:rgba(255,255,255,.65)}.hero:after{content:"2050";position:absolute;right:-5px;bottom:-75px;font-size:250px;font-weight:950;color:rgba(82,100,217,.055)}
.eyebrow,.tag{display:inline-block;background:#fff;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:900;color:var(--blue);margin-bottom:15px}.hero h1{font-size:57px;line-height:1.08;letter-spacing:-3px;margin:0 0 17px;position:relative;z-index:1}.hero h1 span{color:var(--red)}.lead{font-size:18px;line-height:1.8;color:#526074;max-width:690px;position:relative;z-index:1}
.startrow{display:grid;grid-template-columns:1fr 270px;gap:30px;margin-top:32px;position:relative;z-index:2}.mission{background:#fff;border-radius:21px;padding:21px;box-shadow:0 8px 24px #23304812}.mission h3{margin:0 0 8px}.mission p{line-height:1.65;color:var(--muted);font-size:14px}.avatar{background:#fff;border-radius:25px;height:210px;display:flex;align-items:center;justify-content:center;font-size:115px;box-shadow:0 10px 28px #23304812}
.gamehead{padding:23px 34px 0}.stepline{display:flex;justify-content:space-between;font-size:12px;font-weight:900;color:var(--muted)}.progress{height:8px;border-radius:99px;background:#edf0f4;overflow:hidden;margin-top:10px}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--red),#ff9a7e);transition:.45s}
.content{padding:31px 35px 40px}.tag{background:#f0efff;color:var(--blue);margin:0 0 10px}h2{font-size:32px;letter-spacing:-1.4px;margin:0 0 9px}h3{margin:0 0 8px}.desc{color:var(--muted);line-height:1.7}.question{font-size:20px;font-weight:900;line-height:1.65;margin:25px 0 17px}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.choice{min-height:70px;padding:16px 18px;text-align:left;background:#fff;border:2px solid var(--line);border-radius:15px;transition:.16s}.choice:hover{border-color:#ffb4a7;transform:translateY(-2px)}.choice.selected{border-color:var(--red);background:#fff2ef}.choice.correct{border-color:var(--green);background:#effaf5}.choice.wrong{border-color:#df6666;background:#fff1f1}.choice:disabled{cursor:default}
.visual{background:#f7f9fc;border:1px solid #e8ecf2;border-radius:21px;padding:23px;margin:23px 0}.timeline{display:grid;grid-template-columns:repeat(4,1fr);position:relative}.timeline:before{content:"";position:absolute;height:4px;background:#d9dfe8;left:7%;right:7%;top:46px}.era{text-align:center;position:relative;z-index:1}.dot{width:20px;height:20px;border-radius:50%;background:var(--red);border:5px solid white;box-shadow:0 0 0 2px var(--red);margin:36px auto 14px}.year{font-size:12px;font-weight:900;color:var(--red)}.era p{font-size:13px;line-height:1.5;margin:6px auto;max-width:170px}
.graph{height:225px;border-left:2px solid #ccd4df;border-bottom:2px solid #ccd4df;position:relative;background:repeating-linear-gradient(to bottom,transparent 0,transparent 43px,#e8edf2 44px)}.trend{position:absolute;left:4%;bottom:72%;width:91%;height:4px;background:var(--red);border-radius:5px;transform:rotate(-21deg);transform-origin:left center}.gp{position:absolute;width:14px;height:14px;border:4px solid var(--red);background:#fff;border-radius:50%}.a{left:5%;bottom:78%}.b{left:29%;bottom:57%}.c{left:53%;bottom:39%}.d{left:76%;bottom:25%}.e{right:1%;bottom:18%}.xlabel{position:absolute;bottom:5px;font-size:11px;color:var(--muted);font-weight:800}.x1{left:3%}.x2{left:27%}.x3{left:50%}.x4{left:73%}.x5{right:0}
.flow{display:flex;justify-content:center;align-items:center;gap:9px;flex-wrap:wrap}.node{background:#fff;border:2px solid #dce4ee;border-radius:15px;padding:13px 15px;text-align:center;font-weight:900;box-shadow:0 3px 8px #23304808}.arrow{font-size:23px;color:#94a3b8}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.info{background:#f7f8fb;border:1px solid #e8ecf1;border-radius:18px;padding:19px}.icon{font-size:31px;margin-bottom:7px}.info p{font-size:14px;line-height:1.65;color:#526074;margin:5px 0}
.feedback{margin-top:18px;border-radius:15px;padding:15px 17px;line-height:1.65;font-size:14px}.feedback.ok{background:#effaf5;color:#12623e}.feedback.no{background:#fff1f1;color:#9b2525}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:23px}.btn{border:0;border-radius:13px;padding:13px 19px;font-weight:900}.primary{background:var(--red);color:white;box-shadow:0 7px 17px #ff624c35}.secondary{background:#fff;border:1px solid var(--line)}
.policywrap{display:grid;grid-template-columns:1fr 250px;gap:18px}.policygrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.pcard{border:2px solid var(--line);background:#fff;border-radius:16px;padding:17px;text-align:left;min-height:90px}.pcard.selected{border-color:var(--blue);background:#f4f2ff}.cost{float:right;color:var(--blue);font-size:12px;font-weight:900}.meter{background:#f7f8fb;border:1px solid var(--line);border-radius:19px;padding:20px;height:max-content;position:sticky;top:85px}.money{font-size:32px;font-weight:950;margin:5px 0}.meterbar{height:12px;background:#e5e9f0;border-radius:99px;overflow:hidden}.meterbar i{height:100%;display:block;background:var(--blue);transition:.3s}.small{font-size:12px;color:var(--muted);line-height:1.5}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}.stat{padding:19px;border-radius:18px;background:#f7f8fb;text-align:center}.stat .ico{font-size:28px}.stat b{font-size:23px;display:block;margin-top:5px}
.finalbox{text-align:center;padding:30px 0}.rank{font-size:65px;font-weight:950;color:var(--blue)}.score{font-size:28px;font-weight:900;color:var(--red)}.resultgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;text-align:left}.result{padding:19px;background:#f7f8fb;border-radius:18px}.result p{color:#526074;line-height:1.65;font-size:14px}textarea{width:100%;min-height:120px;border:2px solid var(--line);border-radius:15px;padding:13px;font:inherit}
@media(max-width:750px){.hero{padding:37px 24px}.hero h1{font-size:39px}.startrow,.policywrap{grid-template-columns:1fr}.choices,.policygrid,.cards,.resultgrid{grid-template-columns:1fr}.content{padding:25px 19px}.gamehead{padding:20px 19px 0}.timeline{display:block}.timeline:before{display:none}.era{margin:16px 0}.meter{position:static}}

/* Illustrated game interface */
body{background:radial-gradient(circle at 15% 5%,#c8e8ff 0,transparent 35%),radial-gradient(circle at 92% 18%,#ffdfd3 0,transparent 28%),#edf4ff}
.panel{border:3px solid #ffffff;box-shadow:0 20px 55px rgba(39,65,113,.18)}
.nav{background:linear-gradient(90deg,#17264d,#344b9c);color:#fff;border:0}
.logo span{color:#ffcf6d}.pill{background:#ffffff24;color:#fff}
.hero{background:linear-gradient(120deg,#c7eafc,#eef1ff 56%,#ffe5dc)}
.hero h1{text-shadow:0 2px 0 #fff8}
.hero-art{height:235px;position:relative;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 15px 12px #64748b33)}
.hero-art svg{max-height:100%;max-width:100%}
.scene{margin:20px 34px 0;position:relative;min-height:164px;overflow:hidden;border-radius:24px;background:linear-gradient(115deg,#dceeff,#f1edff);display:flex;align-items:center;justify-content:space-between;padding:18px 30px;gap:20px;border:2px solid #ffffff}
.scene:after{content:'';position:absolute;width:200px;height:200px;border-radius:50%;background:#ffffff65;right:-45px;top:-65px}
.scene-copy{position:relative;z-index:2;max-width:48%}.scene-copy small{font-weight:900;color:#5264d9;letter-spacing:1.5px}.scene-copy h3{font-size:23px;margin:8px 0 0;letter-spacing:-.8px}.scene-art{position:relative;z-index:2;width:46%;max-width:350px;height:150px}.scene-art svg{width:100%;height:100%}
.scene.step-5,.scene.step-8{background:linear-gradient(110deg,#e1f8ed,#e3eafa)}
.scene.step-9{background:linear-gradient(110deg,#ffe5e2,#e8eaff)}
.scene.step-10,.scene.step-11{background:linear-gradient(110deg,#fff1cb,#f1e9ff)}
.choice,.pcard{box-shadow:0 4px 0 #dfe6f0;transition:transform .15s,box-shadow .15s,border-color .15s}
.choice:hover,.pcard:hover{transform:translateY(-3px);box-shadow:0 7px 0 #dce2ef}
.choice.selected,.pcard.selected{box-shadow:0 4px 0 #b4b3ec}

.tag{background:#e6edff}.content{padding-top:27px}
@media(max-width:750px){.scene{margin:15px 15px 0;padding:15px;min-height:130px}.scene-copy h3{font-size:17px}.scene-art{height:112px}.scene-copy{max-width:54%}.hero-art{height:160px}}
.policy-illustration{display:flex;align-items:center;gap:22px;padding:23px 28px;background:linear-gradient(110deg,#d8f4ff,#fff0d7);border:2px solid #fff;border-radius:24px;margin:22px 0;box-shadow:0 9px 18px #344b9c10}.policy-emoji{font-size:85px;filter:drop-shadow(0 9px 3px #344b9c20)}.policy-sub{font-weight:950;color:#5364c6;font-size:13px}.policy-illustration h3{font-size:26px;margin:5px 0}.policy-illustration p{color:#526074;font-size:14px;margin:0}.discovery-reveal{padding:20px;background:#fff;border:2px dashed #63bc9a;border-radius:18px;margin:7px 0}.reveal-badge{display:inline-block;background:#dcfce7;color:#166534;border-radius:99px;padding:7px 12px;font-weight:900;margin-bottom:12px}.discovery-reveal h3{font-size:23px}.discovery-reveal a{color:#4357bd}@media(max-width:600px){.policy-emoji{font-size:60px}.policy-illustration{padding:16px;gap:14px}}
.policy-reading{margin:20px 0 24px;background:#f8fbff;border:2px solid #d9e4f6;border-radius:20px;padding:22px 25px;line-height:1.9;font-size:16px;color:#26344d}.policy-reading-label{font-size:13px;font-weight:950;color:#5669bd;margin-bottom:10px}.policy-reading p{margin:0}.choices .choice{line-height:1.65;text-align:left} </style>
</head>
<body><div id="app"></div>
<script>
let step=0,score=0,budget=100,low=[],age=[];const TOTAL=16;
const lowItems=[["보육 시설 확충",20],["공공 교육 서비스 제공",15],["출산·양육 지원",25],["여성의 사회 활동과 육아를 함께 할 수 있는 사회 분위기 조성",25]];
const ageItems=[["국민연금 제도 정비",20],["노인 복지 시설 확대",20],["노인 관련 산업 발전",15],["노인 일자리 개발",20],["노년층 취업 훈련 기회 제공",20]];
const app=document.getElementById("app");
function nav(){return `<nav class="nav"><div class="logo">대한민국 <span>인구 2050</span></div><div class="navright"><span class="pill">STEP ${Math.min(step,TOTAL)}/${TOTAL}</span><span class="pill">⭐ ${score}점</span><span class="pill">💰 ${budget}P</span></div></nav>`}

function artSvg(n){
 const people=`<g transform="translate(25,19)"><circle cx="43" cy="31" r="22" fill="#ffc5a8"/><path d="M21 25 Q25 -5 54 11 Q70 19 65 30" fill="#393f73"/><rect x="10" y="59" width="67" height="78" rx="25" fill="#ff816f"/><circle cx="38" cy="32" r="2.5" fill="#242d55"/><circle cx="53" cy="32" r="2.5" fill="#242d55"/><path d="M39 42 Q46 48 53 42" stroke="#ae5b51" fill="none" stroke-width="2"/></g><g transform="translate(111,28)"><circle cx="37" cy="33" r="23" fill="#ffd3ad"/><path d="M13 27 Q20 -1 44 11 Q61 17 61 30" fill="#554c78"/><rect x="5" y="61" width="69" height="79" rx="24" fill="#5579db"/><circle cx="30" cy="35" r="2.5"/><circle cx="44" cy="35" r="2.5"/><path d="M30 45 Q37 51 45 45" stroke="#b97465" fill="none" stroke-width="2"/></g><g transform="translate(195,47)"><circle cx="32" cy="23" r="20" fill="#ffd7b6"/><path d="M13 16 Q26 -6 48 13" fill="#6d6184"/><rect x="1" y="47" width="62" height="72" rx="25" fill="#61bd9d"/><circle cx="25" cy="23" r="2"/><circle cx="39" cy="23" r="2"/><path d="M25 34 Q33 39 41 34" fill="none" stroke="#ab7564" stroke-width="2"/></g>`;
 const city=`<g><path d="M12 145V77h53v68M71 145V36h70v109M150 145V61h55v84M216 145V21h66v124M292 145V87h42v58" fill="#91aaf3" stroke="#718dd4" stroke-width="3"/>${Array.from({length:5},(_,i)=>`<rect x="${84+i*10}" y="${49+i%2*17}" width="6" height="9" rx="1" fill="#fff3b9"/>`).join('')}<circle cx="32" cy="33" r="19" fill="#ffd06c"/><path d="M0 146H345" stroke="#3da987" stroke-width="10"/></g>`;
 const elderly=`<g transform="translate(72,10)"><circle cx="57" cy="38" r="27" fill="#f9c9a8"/><path d="M30 34Q29 4 55 6Q84 8 84 36Q67 17 53 26Q41 17 30 34" fill="#dfe7f2"/><circle cx="46" cy="42" r="3"/><circle cx="66" cy="42" r="3"/><path d="M45 55Q57 65 69 55" fill="none" stroke="#9d5c5c" stroke-width="3"/><rect x="13" y="70" width="91" height="77" rx="35" fill="#8b8ce8"/><path d="M103 95L126 131" stroke="#f9c9a8" stroke-width="12" stroke-linecap="round"/><path d="M127 126V149" stroke="#896f52" stroke-width="6"/></g><g transform="translate(220,25)"><circle cx="30" cy="29" r="23" fill="#ffd1a8"/><path d="M7 28Q8 1 30 5Q54 2 54 30" fill="#e8e8ef"/><rect x="0" y="59" width="65" height="85" rx="25" fill="#6dbf9c"/></g>`;
 const budget=`<g transform="translate(24,25)"><rect x="0" y="37" width="139" height="81" rx="14" fill="#4dbb9a" stroke="#2b987d" stroke-width="5"/><rect x="15" y="52" width="109" height="52" rx="9" fill="#b9f5cf"/><circle cx="70" cy="78" r="22" fill="#4dbb9a"/><text x="70" y="87" text-anchor="middle" font-size="27" font-weight="bold" fill="white">₩</text></g><g transform="translate(191,10)"><path d="M19 132L40 59L65 83L95 18L119 39L140 2" stroke="#ff805c" stroke-width="11" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M122 3L142 0L144 21" stroke="#ff805c" stroke-width="8" fill="none"/></g>`;
 const graph=`<g transform="translate(28,10)"><rect x="0" y="0" width="300" height="135" rx="17" fill="#fff"/><path d="M31 18V107H273" stroke="#b8c3d8" stroke-width="3" fill="none"/><path d="M43 29L85 47L127 67L168 78L212 93L257 101" stroke="#ff765c" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g fill="#ff765c">${[[43,29],[85,47],[127,67],[168,78],[212,93],[257,101]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="5"/>`).join('')}</g><text x="155" y="128" font-size="12" fill="#64748b" text-anchor="middle">인구 변화 관찰</text></g>`;
 const medal=`<g transform="translate(100,1)"><path d="M43 3H82L108 60L78 76L61 36L44 76L13 60Z" fill="#6678d9"/><circle cx="62" cy="92" r="54" fill="#ffcc59" stroke="#eaa737" stroke-width="9"/><text x="62" y="112" text-anchor="middle" font-size="63" font-weight="900" fill="#fff">S</text></g>`;
 const draw= n===0?people:[1,3,4].includes(n)?city:n===2||n===9?graph:[5,8].includes(n)?budget:[6,7].includes(n)?elderly:medal;
 return `<svg viewBox="0 0 350 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="인구 챌린지 일러스트">${draw}</svg>`;
}
const oldSceneNames=['','시대별 인구 변화를 분석하라!','출산율의 변화를 확인하라!','저출산의 단서를 찾아라!','인구 변화의 영향을 막아라!','정책 예산을 배분하라!','고령화의 원인을 추적하라!','노년층의 문제를 해결하라!','고령화 대책을 선택하라!','2026년의 반전을 읽어라!','2050년 최종 결정을 내려라!','미션 성공! 결과를 확인하라!'];
const sceneNames=['','인구 변화 분석','출산율 그래프 탐험','저출산 원인 탐색','인구 변화의 영향','저출산 예산 설계','부모급여 발견','첫만남이용권 발견','육아휴직 발견','고령화 원인 분석','고령화의 영향','고령화 예산 설계','기초연금 발견','노인 일자리 발견','노인맞춤돌봄 발견','자연감소의 비밀','2050 최종 정책 결정','챌린지 성공'];
function gameScene(){return `<div class="scene step-${step}"><div class="scene-copy"><small>★ POPULATION QUEST</small><h3>${sceneNames[step]||'인구 챌린지'}</h3></div><div class="scene-art">${artSvg(step)}</div></div>`}

function shell(body,bar=true){app.innerHTML=nav()+`<main class="wrap"><section class="panel">${bar?`<div class="gamehead"><div class="stepline"><span>인구 문제 해결 프로젝트</span><span>${Math.min(100,Math.round(step/TOTAL*100))}%</span></div><div class="progress"><i style="width:${Math.min(100,step/TOTAL*100)}%"></i></div></div>`:""}${bar?gameScene():""}${body}</section></main>`;window.scrollTo(0,0)}
let mistakes={};function next(){step++;render()}
function render(){const routes=[start,timeline,lowbirth,causes,impact,lowpolicy,()=>discovery(0),()=>discovery(1),()=>discovery(2),agingcause,agingimpact,agepolicy,()=>discovery(3),()=>discovery(4),()=>discovery(5),current,final,ending];(routes[step]||ending)()}
function start(){shell(`<div class="hero"><div class="eyebrow">2015 개정교육과정 · 사회2</div><h1>대한민국 인구<br><span>2050 챌린지</span></h1><p class="lead">지금부터 약 15~20분 동안 대한민국 인구 문제를 해결해 봅니다. 저출산과 고령화의 원인과 영향을 찾아보고, 제한된 예산으로 정책을 직접 선택하세요.</p><div class="startrow"><div class="mission"><h3>🎯 오늘의 미션</h3><p>인구 변화 → 저출산 → 실제 정책 3개 발견 → 고령화 → 실제 정책 3개 발견 → 2050년 정책 결정</p><button class="btn primary" onclick="next()">챌린지 시작하기 →</button></div><div class="avatar"><div class="hero-art">${artSvg(0)}</div></div></div></div>`,false)}
function qScreen(tag,title,question,items,ans,explain){shell(`<div class="content"><span class="tag">${tag}</span><h2>${title}</h2><div class="question">${question}</div><div class="choices">${items.map((x,i)=>`<button class="choice" onclick="answer(this,${i},${ans},'${explain}')">${i+1}. ${x}</button>`).join("")}</div><div id="fb"></div></div>`)}
function answer(el,i,a,msg){const f=document.getElementById("fb");if(f.dataset.done)return;if(i!==a){mistakes[step]=(mistakes[step]||0)+1;el.classList.add("wrong");el.disabled=true;f.className="feedback no";f.innerHTML="❌ 오답입니다. 다른 선택지를 골라 정답을 맞혀야 다음 미션으로 갈 수 있습니다.";return}document.querySelectorAll(".choice").forEach(b=>b.disabled=true);el.classList.add("correct");score+=mistakes[step]?5:10;f.className="feedback ok";f.dataset.done="1";f.innerHTML="✅ 정답! "+msg+(mistakes[step]?" (재도전 정답: 5점)":" (첫 도전 정답: 10점)")+`<div class="actions"><button class="btn primary" onclick="next()">다음 미션 →</button></div>`}

function canAffordThreeAge(){const costs=ageItems.map(x=>x[1]).sort((a,b)=>a-b);return budget>=costs[0]+costs[1]+costs[2]}
function policy(kind){
 const is=kind==="low",items=is?lowItems:ageItems,arr=is?low:age;
 const canThree=is?true:canAffordThreeAge();
 const need=is?2:(canThree?3:2);
 const intro=is?`2개의 정책을 선택하세요. ⚠️ 주의! 이 단계에서 예산을 너무 많이 사용하면 다음 고령화 단계에서 정책 3개를 선택할 수 없습니다. 다음 단계를 위해 최소 55P를 남기는 것이 좋습니다.`:`${canThree?"3개의 정책을 선택하세요.":"⚠️ 앞 단계에서 예산을 많이 사용하여 3개 정책을 선택할 수 없습니다. 이번 단계에서는 2개 정책만 선택하고 통과할 수 있지만, 정책 점수가 감점됩니다."} 남은 예산 안에서 정책을 선택하세요.`;
 shell(`<div class="content"><span class="tag">MISSION ${is?"05":"11"} · 정책 결정</span><h2>${is?"저출산":"고령화"} 대책에 예산을 투자하라</h2><p class="desc">${intro}</p>${is?'<div class="feedback no" style="display:block">⚠️ 예산 관리 안내: 저출산 정책에 45P를 초과해 사용하면 고령화 정책 3개를 선택할 예산이 부족할 수 있습니다. 고령화 정책 3개의 최소 비용은 55P입니다.</div>':''}<div class="policywrap"><div class="policygrid">${items.map((x,i)=>`<button class="pcard ${arr.includes(i)?"selected":""}" onclick="pick(this,'${kind}',${i},${x[1]})"><span class="cost">${x[1]}P</span><b>${x[0]}</b><p class="small">${is?"저출산 대응":"고령화 대응"}</p></button>`).join("")}</div><aside class="meter"><div class="small">남은 정책 예산</div><div class="money" id="money">${budget}P</div><div class="meterbar"><i style="width:${budget}%"></i></div><p id="picked" class="small">선택 ${arr.length}/${need}</p><p id="policyhint" class="small">${is?'다음 단계의 최소 필요 예산: 55P':(canThree?'정책 3개 선택 가능':'예산 부족: 정책 2개 통과 가능 (점수 감점)')}</p></aside></div><div id="fb"></div><div class="actions"><button class="btn primary" onclick="confirmPolicy('${kind}')">정책 확정하기 →</button></div></div>`)
}
function pick(el,kind,i,cost){
 const is=kind==="low",arr=is?low:age,items=is?lowItems:ageItems;
 if(arr.includes(i)){arr.splice(arr.indexOf(i),1);budget+=cost;el.classList.remove("selected")}
 else{
  if(arr.length>=(is?2:3)){document.getElementById('fb').className='feedback no';document.getElementById('fb').textContent='더 이상 정책을 선택할 수 없습니다. 기존 선택을 해제한 뒤 다시 고르세요.';return}
  if(budget<cost){document.getElementById('fb').className='feedback no';document.getElementById('fb').textContent='예산이 부족합니다. 더 저렴한 정책을 고르거나 기존 선택을 해제하세요.';return}
  arr.push(i);budget-=cost;el.classList.add("selected")
 }
 const remainingCosts=items.map((x,j)=>arr.includes(j)?null:x[1]).filter(x=>x!==null).sort((a,b)=>a-b);
 const threePossible=is?true:(arr.length===3 || (arr.length<3 && budget>=remainingCosts.slice(0,3-arr.length).reduce((a,b)=>a+b,0)));
 const target=is?2:(threePossible?3:2);
 document.getElementById('money').textContent=budget+'P';
 document.querySelector('.meterbar i').style.width=budget+'%';
 document.getElementById('picked').textContent=`선택 ${arr.length}/${target}`;
 document.getElementById('policyhint').textContent=is?`다음 고령화 단계: ${budget>=55?'3개 정책을 선택할 예산이 남아 있습니다.':'3개 선택에 필요한 55P보다 적습니다. 다음 단계에서 2개만 선택하면 감점됩니다.'}`:(threePossible?'정책 3개 선택 시 정상 점수':'현재 예산으로 3개 선택 불가: 2개 선택 시 감점');
 const f=document.getElementById('fb');if(f && !f.dataset.done){f.className='';f.textContent=''}
 document.querySelector('.navright').innerHTML=`<span class="pill">STEP ${step}/${TOTAL}</span><span class="pill">⭐ ${score}점</span><span class="pill">💰 ${budget}P</span>`
}
function confirmPolicy(kind){
 const f=document.getElementById('fb');if(f.dataset.done)return;
 const is=kind==='low',arr=is?low:age;
 const remaining=ageItems.map((x,i)=>arr.includes(i)?null:x[1]).filter(x=>x!==null).sort((a,b)=>a-b);
 const canReachThree=is?true:(arr.length===3 || (arr.length<3 && budget>=remaining.slice(0,3-arr.length).reduce((a,b)=>a+b,0)));
 if(is && arr.length!==2){f.className='feedback no';f.textContent='저출산 정책 2개를 선택하세요.';return}
 if(!is && arr.length!==3 && !(arr.length===2 && !canReachThree)){
  f.className='feedback no';f.textContent=canReachThree?'예산 안에서 정책 3개를 선택할 수 있습니다. 3개를 선택해 주세요.':'정책 2개를 선택해야 다음 단계로 이동할 수 있습니다.';return
 }
 const reduced=!is && arr.length===2;
 const earned=reduced?5:10+Math.min(5,Math.floor(budget/10));
 score+=earned;
 f.className='feedback ok';f.dataset.done='1';
 f.innerHTML=`✅ 정책이 확정되었습니다. ${is?'저출산':'고령화'} 대책 ${arr.length}개를 선택했습니다. <b>+${earned}점</b>${reduced?' (예산 부족으로 2개만 선택하여 정책 점수 감점)':''}<div class="actions"><button class="btn primary" onclick="next()">다음 미션 →</button></div>`;
 document.querySelector('.navright').innerHTML=`<span class="pill">STEP ${step}/${TOTAL}</span><span class="pill">⭐ ${score}점</span><span class="pill">💰 ${budget}P</span>`
}

function discovery(n){const p=realPolicies[n];shell(`<div class="content"><span class="tag">REAL POLICY ${String(n+1).padStart(2,'0')} / 06 · 실제 정책 분석</span><h2>${p.title}</h2><div class="policy-illustration"><div class="policy-emoji">${p.emoji}</div><div><div class="policy-sub">📁 대한민국 정부 정책 조사 파일</div><h3>${p.theme}</h3><p>자료를 읽고 효과·한계·적용 사례를 판단하세요.</p></div></div><div class="policy-reading"><div class="policy-reading-label">📄 정책 설명 자료</div><p>${p.story}</p></div><div class="question">${p.question}</div><div class="choices">${p.opts.map((v,i)=>`<button class="choice" onclick="solveDiscovery(this,${n},${i})">${i+1}. ${v}</button>`).join('')}</div><div id="fb"></div></div>`)}
function solveDiscovery(el,n,i){const f=document.getElementById('fb'),p=realPolicies[n];if(f.dataset.done)return;if(i!==p.ans){mistakes[step]=(mistakes[step]||0)+1;el.classList.add('wrong');el.disabled=true;f.className='feedback no';f.textContent='🔒 아직 통과하지 못했습니다. 힌트: '+p.hint+' 정답을 맞혀야 다음 단계로 진행합니다.';return}document.querySelectorAll('.choice').forEach(b=>b.disabled=true);el.classList.add('correct');const earned=mistakes[step]?8:15;score+=earned;f.className='feedback ok';f.dataset.done='1';f.innerHTML=`<div class="discovery-reveal"><div class="reveal-badge">🔓 실제 정책 분석 성공 · +${earned}점</div><h3>${p.emoji} ${p.label}</h3><p>${p.detail}</p><p class="small">📚 정부 정책 확인: <a href="${p.url}" target="_blank" rel="noopener">공식 안내 사이트 ↗</a></p></div><div class="actions"><button class="btn primary" onclick="next()">정책 분석 완료! 다음 미션 →</button></div>`;document.querySelector('.navright').innerHTML=`<span class="pill">STEP ${step}/${TOTAL}</span><span class="pill">⭐ ${score}점</span><span class="pill">💰 ${budget}P</span>`}

function finish(){const n=document.querySelectorAll("[data-f].selected").length,f=document.getElementById("fb");if(n!==2){f.className="feedback no";f.innerHTML="정책을 2개 선택하세요.";return}const picked=[...document.querySelectorAll("[data-f].selected")].map(e=>+e.dataset.f);score+=picked.some(i=>i<4)&&picked.some(i=>i>=4)?15:9;step=17;ending()}
function ending(){let rank=score>=195?"S":score>=165?"A":score>=130?"B":"C";let title={S:"대한민국 인구 문제 해결사",A:"인구 정책 설계자",B:"인구 문제 도전자",C:"인구 문제 탐색자"}[rank];shell(`<div class="content finalbox"><span class="tag">MISSION COMPLETE</span><h2>2050 대한민국</h2><div class="rank">${rank}</div><div class="score">${score}점 / 215점</div><p class="desc">S: 195~215점 · A: 165~194점 · B: 130~164점 · C: 0~129점</p><h2>${title}</h2><p class="desc">저출산과 고령화의 원인·영향·대책을 살펴보고, 2026년의 자연감소와 중위 연령 상승까지 확인했습니다.</p><div class="resultgrid"><div class="result"><h3>👶 저출산</h3><p>여성의 사회 참여, 결혼 연령 상승, 주택·육아·교육 부담, 가치관 변화 등의 요인을 살펴보았습니다.</p></div><div class="result"><h3>👴 고령화</h3><p>경제 발전과 의학 기술 발달 → 평균 수명 연장 → 노인 인구 증가의 흐름을 확인했습니다.</p></div><div class="result"><h3>📊 현재 상황</h3><p>2026년 1월 출생아 수가 증가했지만 출생자보다 사망자가 많아 자연감소가 나타나고, 중위 연령도 지속적으로 상승하고 있습니다.</p></div></div><div class="visual" style="text-align:left;margin-top:22px"><h3>🏆 최종 성적</h3><p class="desc">같은 등급이라도 정답과 선택에 따라 개인별 점수가 다릅니다. 결과 화면을 선생님께 보여 주세요.</p></div><div class="actions"><button class="btn secondary" onclick="location.reload()">다시 도전하기</button></div></div>`)}
render();
